<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BRIC Tile Alignment</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div class="title">
          <h1>BRIC Tile Alignment</h1>
          <p>Assign physical tile receivers to wall grid positions.</p>
        </div>
        <div class="controls">
          <label>Columns <input id="cols" type="number" min="1" max="64" value="2"></label>
          <label>Rows <input id="rows" type="number" min="1" max="64" value="2"></label>
          <button id="applyWall">Apply Wall</button>
          <button id="discover">Discover Tiles</button>
          <button id="start">Start Alignment</button>
          <button id="save">Save Layout</button>
          <button id="load" class="secondary">Load Saved</button>
          <a class="button" href="/api/download">Download JSON</a>
          <button id="reset" class="secondary">Reset</button>
        </div>
      </section>

      <section class="status-bar">
        <div id="status">Ready.</div>
        <div id="currentTile">Current tile: none</div>
      </section>

      <section class="content">
        <div class="wall-panel">
          <div id="grid" class="grid" aria-label="Wall grid"></div>
        </div>
        <aside class="side-panel">
          <h2>Discovered Tiles</h2>
          <ul id="tileList" class="tile-list"></ul>
          <h2>Assignments</h2>
          <pre id="layoutPreview">{}</pre>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
