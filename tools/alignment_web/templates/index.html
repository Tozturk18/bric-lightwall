<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BRIC Tile Alignment</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div id="setupModal" class="modal">
      <form id="setupForm" class="modal-card">
        <p class="eyebrow">BRIC Light Wall</p>
        <h1>Tile Alignment</h1>
        <p class="modal-copy">Enter the wall size. The app will discover tiles, turn the first MAC address red, and guide you through placement.</p>
        <div class="modal-fields">
          <label>Columns <input id="cols" type="number" min="1" max="64" value="2"></label>
          <label>Rows <input id="rows" type="number" min="1" max="64" value="2"></label>
        </div>
        <button type="submit" id="begin">Begin Alignment</button>
      </form>
    </div>

    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">BRIC Light Wall</p>
          <h1>Tile Alignment</h1>
        </div>
        <div class="actions">
          <button id="save">Save</button>
          <a class="button ghost" href="/api/download">Download JSON</a>
          <button id="reset" class="ghost">Reset</button>
        </div>
      </header>

      <section class="guide">
        <div>
          <p class="label">Current Tile</p>
          <div id="currentTile" class="current-tile">Waiting to start</div>
        </div>
        <div>
          <p class="label">Status</p>
          <div id="status">Enter wall size to begin.</div>
        </div>
      </section>

      <section class="content">
        <div class="wall-panel">
          <div id="grid" class="grid" aria-label="Wall grid"></div>
        </div>
        <aside class="side-panel">
          <h2>Detected Tiles</h2>
          <ul id="tileList" class="tile-list"></ul>
          <h2>Layout</h2>
          <pre id="layoutPreview">{}</pre>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
